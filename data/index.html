<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bobcat AMG Ignition</title>
    <link rel="stylesheet" href="style.css?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400;500;700;900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="amg-dashboard">
        <!-- Top Status Bar -->
        <header class="dashboard-header">
            <div class="header-left">
                <div class="brand-logo">
                    <span class="amg-slashes">///</span>BOBCAT
                </div>
                <div class="model-badge">Gt <span class="r-badge">R</span></div>
            </div>
            <div class="header-center">
                <div id="master-status" class="status-pill request-loader">SYSTEM CHECK</div>
            </div>
            <div class="header-right">
                <div class="clock-display">12:00 PM</div>
            </div>
        </header>

        <!-- Main Instrument Cluster -->
        <main class="cluster-grid">

            <!-- Left Wing: Oil Temp & Oil Pressure -->
            <aside class="wing-panel left-wing">
                <div class="gauge-group">
                    <!-- Gauge 1: Oil Temp -->
                    <div class="bar-gauge-wrapper">
                        <div class="gauge-label">OIL TEMP</div>
                        <div class="bar-track">
                            <div class="bar-fill" id="tempNeedle"></div>
                        </div>
                        <div class="digital-value" id="tempValue">--</div>
                    </div>

                    <!-- Gauge 2: Oil Pressure (Info Box) -->
                    <div class="info-box-wrapper">
                        <div class="gauge-label">OIL PRESS</div>
                        <div class="digital-value-large" id="pressureValue">--</div>
                        <div class="unit-label">PSI</div>
                    </div>
                </div>
            </aside>

            <!-- Center Stage: Hydraulic Pressure (Hero) -->
            <section class="center-stage">
                <div class="hero-gauge-container">
                    <div class="hero-dial">
                        <svg class="dial-ring" viewBox="0 0 200 200">
                            <circle cx="100" cy="100" r="90" class="dial-bg"></circle>
                            <circle cx="100" cy="100" r="90" class="dial-progress" id="hydNeedle"></circle>
                        </svg>
                        <div class="hero-content">
                            <div class="hero-label">HYDRAULIC</div>
                            <div class="hero-value" id="hydValue">0</div>
                            <div class="hero-unit">PSI</div>
                        </div>
                    </div>
                </div>
                <!-- Sub-hero info removed as they are now side gauges -->
            </section>

            <!-- Right Wing: Fuel & Voltage + Ignition -->
            <aside class="wing-panel right-wing">
                <div class="gauge-group">
                    <!-- Gauge 3: Fuel -->
                    <div class="bar-gauge-wrapper">
                        <div class="gauge-label">FUEL</div>
                        <div class="bar-track">
                            <div class="bar-fill" id="fuelNeedle"></div>
                        </div>
                        <div class="digital-value" id="fuelValue">--</div>
                    </div>

                    <!-- Gauge 4: Voltage (Info Box) -->
                    <div class="info-box-wrapper">
                        <div class="gauge-label">VOLTS</div>
                        <div class="digital-value-large" id="voltageValue">--</div>
                        <div class="unit-label">V</div>
                    </div>
                </div>

                <!-- Control Cluster (Ignition + Buttons) -->
                <div class="control-cluster">
                    <!-- Ignition Slot Area -->
                    <div class="ignition-module">
                        <div class="ignition-bezel">
                            <div class="face" id="clockFace">
                                <div class="pos-indicator off-label">OFF</div>
                                <div class="pos-indicator on-label">ON</div>
                                <div class="pos-indicator glow-label">GLOW
                                    <span id="glow-timer" class="glow-countdown"></span>
                                </div>
                                <div class="pos-indicator start-label">START</div>
                                <div class="key-slot-container">
                                    <div class="key" id="ignitionKey">
                                        <div class="key-head"></div>
                                        <div class="key-body"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="warning-cluster">
                        <div class="warning-item" id="oil-warning" title="Low Oil">
                            <span class="icon">🛢️</span>
                        </div>
                        <div class="warning-item" id="temp-warning" title="High Temp">
                            <span class="icon">🌡️</span>
                        </div>
                        <div class="warning-item" id="battery-warning" title="Battery">
                            <span class="icon">⚡</span>
                        </div>
                        <div class="warning-item" id="glow-indicator">
                            <span class="icon">🌀</span>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button class="amg-btn light-btn" data-action="toggle_lights">LIGHTS</button>
                        <button class="amg-btn stop-btn" data-action="emergency_stop">STOP</button>
                    </div>
                </div>
            </aside>
        </main>
    </div>
