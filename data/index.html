<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Bobcat 743</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
  <div class="top">
    <div class="brand"><b>Bobcat&nbsp;743</b><small>Kubota V1702</small></div>
    <div class="state" id="state"><span class="dot"></span><span id="stateLabel">Off</span></div>
  </div>

  <div class="strip" id="strip">
    <div class="s"><span class="sk"><i id="wifiDot"></i>WiFi</span><span class="sv" id="wifiInfo">--</span></div>
    <div class="s"><span class="sk"><i id="apDot"></i>AP</span><span class="sv" id="apInfo">--</span></div>
    <div class="s"><span class="sk"><i id="mqttDot"></i>MQTT</span><span class="sv" id="mqttInfo">--</span></div>
    <div class="s"><span class="sk"><i id="clockDot"></i>Clock</span><span class="sv" id="clockInfo">--</span></div>
  </div>

  <div class="seq" id="seq">
    <span class="step" data-idx="0">Off</span><span class="sep"></span>
    <span class="step" data-idx="1">On</span><span class="sep"></span>
    <span class="step" data-idx="2">Glow</span><span class="sep"></span>
    <span class="step" data-idx="3">Start</span><span class="sep"></span>
    <span class="step" data-idx="4">Run</span>
  </div>

  <div class="hero" id="hero"></div>
  <div class="vitals" id="vitals"></div>

  <div class="row-h">Outputs</div>
  <div class="cells" id="outputs">
    <div class="cell" data-key="power"><div class="ch"><span class="cl">Power</span><span class="cd"></span></div><div class="cs">OFF</div></div>
    <div class="cell" data-key="glow"><div class="ch"><span class="cl">Glow</span><span class="cd"></span></div><div class="cs">OFF</div></div>
    <div class="cell" data-key="starter"><div class="ch"><span class="cl">Starter</span><span class="cd"></span></div><div class="cs">OFF</div></div>
    <div class="cell" data-key="lights"><div class="ch"><span class="cl">Lights</span><span class="cd"></span></div><div class="cs">OFF</div></div>
  </div>

  <div class="row-h">Fault lamps</div>
  <div class="cells" id="faults">
    <div class="cell" data-key="oil"><div class="ch"><span class="cl">Oil</span><span class="cd"></span></div><div class="cs">OK</div></div>
    <div class="cell" data-key="temp"><div class="ch"><span class="cl">Temp</span><span class="cd"></span></div><div class="cs">OK</div></div>
    <div class="cell" data-key="battery"><div class="ch"><span class="cl">Battery</span><span class="cd"></span></div><div class="cs">OK</div></div>
    <div class="cell" data-key="fuel"><div class="ch"><span class="cl">Fuel</span><span class="cd"></span></div><div class="cs">OK</div></div>
  </div>

  <div class="row-h">Ignition</div>
  <div class="ignition">
    <div class="keyseg" id="keyseg">
      <button class="kb" data-pos="0">Off</button>
      <button class="kb" data-pos="1">On</button>
      <button class="kb" data-pos="2">Glow</button>
    </div>
    <button class="btn crank" id="btnCrank">Hold to Start</button>
  </div>

  <div class="controls">
    <button class="btn light" id="btnLights">Lights</button>
    <a href="settings.html" class="btn ghost">Config</a>
    <button class="btn stop" id="btnStop"><span class="rr"></span>Emergency Stop</button>
  </div>
  <div class="cap" id="cap">Engine hours --</div>
</div>
<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>
